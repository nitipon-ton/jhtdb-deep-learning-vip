# =============================================================================
# Super-Resolution: Meteorology-inspired UNet
# =============================================================================
# Adapted from the Yasuda et al. (2023) - Super-resolution of three-dimensional 
# temperature and velocity for building-resolving urban micrometeorology 
# using physics-guided convolutional neural networks with image inpainting techniques  

# github repo of original code: https://github.com/YukiYasuda2718/3d-sr-micrometeorology/tree/main

# 3D SR meteorology architecture converted to 2D with
# PixelShuffle-based decoder and optional bilinear pre-upsampling.
# =============================================================================

experiment:
  name: "sr_unet_meteo_isotropic"
  run_name: sr_unet_meteo_isotropic_128_withoutPhysics  # Optional: set to reuse work/SR/<run_name>
  description: "UNet with custom blocks inspired by 3D micrometeorology SR"
  author: "Aditya Sai Pranith Ayapilla"

data:
  h5_path: "data/raw/isotropic_xy_128/isotropic_xy_128.h5"
  split:
    train_snapshots: 5994
    val_snapshots: 1198
    test_snapshots: 800
  component: "omega_z"
  normalization:
    method: "global"
  lr_maker:
    method: "avgpool"
    scale: 4
  temporal:
    enabled: false
  augmentation:
    enabled: false
    rot180: true
    flipx: true
    flipy: true
    cyclic_shift: false

domain:
  dataset: "isotropic1024coarse"
  dns_info:
    effective_resolution:
      dx: 0.006136
      dy: 0.006136
      dz: 0.006136

model:
  architecture: "unet_meteo"
  scale_factor: 4
  unet_meteo:
    in_ch: 1
    out_ch: 1
    feature_channels: [32, 64, 128, 256, 256]
    n_blocks_per_stage: 2
    num_latent_layers: 2
    pre_upsample_mode: "bilinear"

training:
  epochs: 200
  batch_size: 32
  num_workers: 0
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  lr_scheduler:
    enabled: true
    type: "cosine"
    t_max: 60
    eta_min: 1.0e-5
  mixed_precision: true
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_loss"
    mode: "min"
  checkpoints:
    best: "best_model.pth"
    last: "last_model.pth"

loss:
  components:
    pixel:
      enabled: true
      weight: 1.0
      type: "l2"
    gradient:
      enabled: true
      weight: 0.1
    spectral:
      enabled: false
    physics:
      enabled: false
      lambda_adv: 1.0e-1
      lambda_diff: 1.0e-1
      lambda_grad: 0.0
      warmup:
        enabled: false
        warmup_epochs: 10

evaluation:
  compute_psnr: true
  compute_ssim: true
  turbulence_metrics:
    enabled: true
    energy_spectrum: true
    enstrophy: true

hardware:
  device: "cuda"
