# =============================================================================
# Super-Resolution: UNet Meteo (512 snapshot, random crop pipeline)
# =============================================================================

experiment:
  name: "sr_unet_meteo_isotropic_512crops"
  run_name: "sr_unet_meteo_isotropic_512crops_physicsON"
  description: "UNet with meteorology blocks using random 128×128 crops from 512×512 snapshots"
  author: "Aditya Sai Pranith Ayapilla"

data:
  h5_path: "data/raw/isotropic_xy_512/isotropic_xy_512.h5"
  mode: "isotropic512_crops"
  split:
    train_snapshots: 700
    val_snapshots: 150
    test_snapshots: 149
  component: "omega_z"
  normalization:
    method: "global"
  crops:
    patch_size_hr: 128
    train_crops_per_snapshot: 8
  lr_maker:
    method: "avgpool"
    scale: 4
  temporal:
    enabled: false
  augmentation:
    enabled: false
    rot180: true
    flipx: true
    flipy: true
    cyclic_shift: false

domain:
  dataset: "isotropic1024coarse"
  dns_info:
    effective_resolution:
      dx: 0.006136
      dy: 0.006136
      dz: 0.006136

model:
  architecture: "unet_meteo"
  scale_factor: 4
  unet_meteo:
    in_ch: 1
    out_ch: 1
    feature_channels: [16, 32, 64, 128, 128]
    n_blocks_per_stage: 2
    num_latent_layers: 1
    pre_upsample_mode: "bilinear"

training:
  epochs: 100
  batch_size: 32
  num_workers: 0
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  lr_scheduler:
    enabled: true
    type: "cosine"
    t_max: 60
    eta_min: 1.0e-5
  mixed_precision: true
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_loss"
    mode: "min"
  checkpoints:
    best: "best_model.pth"
    last: "last_model.pth"

loss:
  components:
    pixel:
      enabled: true
      weight: 1.0
      type: "l2"
    gradient:
      enabled: false
      weight: 0.1
    spectral:
      enabled: false
    physics:
      enabled: true
      track_only: false
      lambda_adv: 1.0e-1
      lambda_diff: 2.0e-1
      lambda_grad: 0.0
      warmup:
        enabled: false
        warmup_epochs: 10

evaluation:
  compute_psnr: true
  compute_ssim: true
  turbulence_metrics:
    enabled: true
    energy_spectrum: true
    enstrophy: true

hardware:
  device: "cuda"
