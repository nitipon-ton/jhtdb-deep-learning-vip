# =============================================================================
# Super-Resolution: Hybrid DSC/MS (Fukami et al. 2019) for Isotropic Turbulence
# =============================================================================
# This configuration mirrors the original hDSC/MS architecture.  The LR input
# is pre-upsamped to the HR grid before entering the network, matching the
# reference implementation shared by Kai Fukami.
# =============================================================================

experiment:
  name: "sr_hdsc_ms_fukami"
  run_name: sr_hdsc_ms_fukami_lightweight_withPhysics  # Optional: set to reuse work/SR/<run_name>
  description: "Hybrid DSC/MS (Fukami 2019) for isotropic turbulence SR (128→512)"
  author: "Aditya Sai Pranith Ayapilla"

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
data:
  h5_path: "data/raw/isotropic_xy_128/isotropic_xy_128.h5"

  split:
    train_snapshots: 5994
    val_snapshots: 1198
    test_snapshots: 800

  component: "omega_z"

  normalization:
    method: "global"

  lr_maker:
    method: "avgpool"
    scale: 4

  temporal:
    enabled: false

  augmentation:
    enabled: false
    cyclic_shift: false
    rot180: true
    flipx: true
    flipy: true
    rot90: false
    sign_maps:
      omega_z: {flipx: -1, flipy: -1}

# # =============================================================================
# # DOMAIN INFORMATION
# # =============================================================================
# domain:
#   dataset: "isotropic1024coarse"
#   dns_info:
#     effective_resolution:
#       dx: 0.006136
#       dy: 0.006136
#       dz: 0.006136

# =============================================================================
# MODEL ARCHITECTURE - Hybrid DSC/MS
# =============================================================================
model:
  architecture: "hdsc_ms"
  scale_factor: 4

  hdsc_ms:
    in_ch: 1
    out_ch: 1
    dsc_width: 32
    ms_mid: 16
    ms_small: 8
    ms_out: 3
    upsample_mode: "bilinear"   # Pre-upsampling mode before the DSC/MS backbone

# =============================================================================
# TRAINING
# =============================================================================
training:
  epochs: 200
  batch_size: 32
  num_workers: 0
  optimizer: "adam"
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

  lr_scheduler:
    enabled: true
    type: "step"
    step_size: 30
    gamma: 0.5

  mixed_precision: true

  gradient_clipping:
    enabled: true
    max_norm: 1.0

  early_stopping:
    enabled: false
    patience: 20
    metric: "val_loss"
    mode: "min"
  checkpoints:
    best: "best_model.pth"
    last: "last_model.pth"

# =============================================================================
# LOSS FUNCTIONS
# =============================================================================
loss:
  components:
    pixel:
      enabled: true
      weight: 1.0
      type: "l2"

    gradient:
      enabled: false
      weight: 0.1

    spectral:
      enabled: false

    physics:
      enabled: true
      track_only: false
      lambda_adv: 1.0e-1
      lambda_diff: 1.0e-1
      lambda_grad: 0.0
      warmup:
        enabled: true
        warmup_epochs: 10

# =============================================================================
# EVALUATION
# =============================================================================
evaluation:
  compute_psnr: true
  compute_ssim: true
  turbulence_metrics:
    enabled: true
    energy_spectrum: true
    enstrophy: true
    two_point_correlation: true
    vorticity_statistics: true

hardware:
  device: "cuda"
