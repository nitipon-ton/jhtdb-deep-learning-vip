# =============================================================================
# Super-Resolution: Physics-Informed Hybrid DSC/MS for Isotropic Turbulence (64→512, 8× upsampling)
# =============================================================================
# This config enables physics-informed training with advection and diffusion
# losses based on the vorticity transport equation.
#
# Architecture: Hybrid DSC/MS (Depthwise Separable Convolution + Multi-Scale)
# Inspired by Fukami et al. (2019) turbulence super-resolution
#
# Physics losses:
#   - Advection: L_adv = ||u·∇ω||²  (vorticity transport)
#   - Diffusion: L_diff = ||∇²ω||²  (viscous smoothing)
#
# Based on vorticity transport equation:
#   ∂ω/∂t + u·∇ω = ν∇²ω
# =============================================================================

experiment:
  name: "sr_hdsc_ms_physics_isotropic"
  description: "Physics-informed Hybrid DSC/MS for isotropic turbulence SR with advection/diffusion losses"
  author: "Aditya Sai Pranith Ayapilla"

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
data:
  h5_path: "data/raw/isotropic_xy_512/isotropic_xy_512.h5"

  split:
    train_snapshots: 800   
    val_snapshots: 150     
    test_snapshots: 49    

  component: "omega_z"     # Primary component for SR

  normalization:
    method: "global"       # Global normalization across all components

  lr_maker:
    method: "avgpool"
    scale: 4

  temporal:
    enabled: false         # Disable for initial experiments
    num_frames: 3
    frame_spacing: 1

  augmentation:
    enabled: false
    cyclic_shift: true     # Periodic boundaries (valid for isotropic turbulence)
    rot180: true
    flipx: true
    flipy: true
    rot90: false           # 90° rotation not physics-preserving for vorticity
    noise:
      enabled: false
      std: 0.01
    sign_maps:             # Sign changes under transformations
      ux: {flipx: -1, flipy: 1}
      uy: {flipx: 1, flipy: -1}
      uz: {flipx: 1, flipy: 1}
      omega_z: {flipx: -1, flipy: -1}

# =============================================================================
# DOMAIN INFORMATION (from isotropic_xy_plane.yaml)
# =============================================================================
domain:
  dataset: "isotropic1024coarse"
  full_domain: "2π × 2π × 2π"
  fetched_domain: "π × π"      # Half domain for DNS resolution matching

  dns_info:
    full_grid: "1024 × 1024 × 1024"
    domain_fraction: 0.5
    effective_resolution:
      dx: 0.006136           # π / 512 (critical for physics losses!)
      dy: 0.006136
      dz: 0.006136

# =============================================================================
# MODEL ARCHITECTURE - Hybrid DSC/MS
# =============================================================================
model:
  architecture: "hdsc_ms"    # Registered name in models/factory.py
  scale_factor: 4            # ✓ CORRECTED: 128→512 is 4×, not 8×!

  hdsc_ms:
    in_ch: 1
    out_ch: 1
    dsc_width: 96            # ✓ INCREASED for higher capacity (was 64)
    ms_mid: 32               # Multi-scale mid channels
    ms_small: 16             # Multi-scale small channels
    ms_out: 3                # ✓ MS output channels (required!)
    activation: "relu"

# =============================================================================
# TRAINING
# =============================================================================
training:
  epochs: 100              # Reduced for initial experiments
  batch_size: 4            # Reduced from 8 for 8× upsampling (4× more memory)
  num_workers: 0
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  lr_scheduler:
    enabled: true
    type: "cosine"
    warmup_epochs: 5
    min_lr: 1.0e-6
  mixed_precision: false    # Disable for MPS stability
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_loss"
    mode: "min"

# =============================================================================
# LOSS FUNCTIONS - Physics-Informed
# =============================================================================
loss:
  components:
    pixel:
      enabled: true
      weight: 1.0
      type: "l1"            # MSE loss

    gradient:
      enabled: false        # Can be enabled for sharper gradients
      weight: 0.2

    spectral:
      enabled: false        # Can be enabled for spectral accuracy
      weight: 0.1
      num_bins: 20
      log_bins: true

    # =========================================================================
    # NEW: Physics-informed losses
    # =========================================================================
    physics:
      enabled: false         # ENABLE PHYSICS LOSSES

      # Advection loss: penalizes u·∇ω
      # Encourages vorticity transport by flow
      lambda_adv: 0.01      # Start small, tune as needed

      # Diffusion loss: penalizes ∇²ω
      # Encourages smooth fields (viscous diffusion)
      lambda_diff: 0.01     # Start small, tune as needed

      # Optional gradient regularization
      lambda_grad: 0.0      # Disabled by default

      # Warmup settings (optional)
      warmup:
        enabled: false      # Set true to ramp up physics losses
        warmup_epochs: 10   # Epochs before full physics weight
        start_fraction: 0.1 # Start at 10% of full weight

# =============================================================================
# EVALUATION
# =============================================================================
evaluation:
  compute_psnr: true
  compute_ssim: true
  turbulence_metrics:
    enabled: true
    energy_spectrum: true
    enstrophy: true
    two_point_correlation: true
    vorticity_statistics: true  # NEW: For physics validation

hardware:
  device: "cuda"  # Use GPU (was "mps" for Apple Silicon)             # Use MPS for Apple Silicon

# =============================================================================
# NOTES
# =============================================================================
# Physics loss tuning guidelines:
#
# 1. Start with small weights (0.01) for both lambda_adv and lambda_diff
# 2. If physics loss dominates, reduce weights to 0.001
# 3. If physics loss has no effect, increase weights to 0.1
# 4. Monitor loss curves:
#    - Advection loss should decrease (less violation of transport)
#    - Diffusion loss may increase or decrease (depends on flow)
#    - Pixel loss should not degrade significantly
#
# 5. Enable warmup if training is unstable initially
# 6. Grid spacing (dx, dy) is CRITICAL - must match DNS resolution
#
# Expected behavior:
#   - Physics losses guide model toward physically consistent solutions
#   - May slightly reduce PSNR but improve generalization
#   - Temporal coherence should improve (test on time series)
#   - Vorticity statistics should be more accurate
# =============================================================================
