# Residual CNN comparison using the exact corrected U-Net data/training settings.
# Only the model architecture section and experiment identity differ.

experiment:
  name: "vip_residual_cnn_corrected_physics_x4"
  run_name: "vip_residual_cnn_corrected_physics_x4"
  description: "Full-resolution residual correction CNN on 2D JHTDB vorticity"
  author: "Tony"

data:
  h5_path: "data/raw/isotropic_xy_128/isotropic_xy_128.h5"
  split:
    train_snapshots: 3000
    val_snapshots: 600
    test_snapshots: 400
  component: "omega_z"
  normalization:
    method: "global"
  lr_maker:
    method: "avgpool"
    scale: 4
  temporal:
    enabled: false
  augmentation:
    enabled: false
    rot180: true
    flipx: true
    flipy: true
    cyclic_shift: false

domain:
  dataset: "isotropic1024coarse"
  dns_info:
    effective_resolution:
      dx: 0.006136
      dy: 0.006136
      dz: 0.006136

model:
  architecture: "residual_cnn"
  scale_factor: 4
  residual_cnn:
    in_ch: 1
    out_ch: 1
    hidden_channels: 32
    num_residual_blocks: 4
    kernel_size: 3
    dilation: 1
    normalization: "batch"
    group_norm_groups: 8
    activation: "relu"
    dropout_rate: 0.0
    upsample_mode: "bicubic"

training:
  epochs: 200
  batch_size: 32
  num_workers: 0
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  lr_scheduler:
    enabled: true
    type: "cosine"
    t_max: 60
    eta_min: 1.0e-5
  mixed_precision: true
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  early_stopping:
    enabled: true
    patience: 20
    metric: "val_loss"
    mode: "min"
  checkpoints:
    best: "best_model.pth"
    last: "last_model.pth"

loss:
  components:
    pixel:
      enabled: true
      weight: 1.0
      type: "l2"
    gradient:
      enabled: true
      weight: 0.1
    spectral:
      enabled: false
    physics:
      enabled: true
      track_only: false
      lambda_adv: 1.0e-1
      lambda_diff: 1.0e-1
      lambda_grad: 0.0
      warmup:
        enabled: false
        warmup_epochs: 10

evaluation:
  compute_psnr: true
  compute_ssim: true
  turbulence_metrics:
    enabled: true
    energy_spectrum: true
    enstrophy: true

hardware:
  device: "cuda"

